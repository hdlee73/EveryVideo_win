name: Windows build & release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version
        id: ver
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"; release=true
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]] \
               && [ -z "$(git ls-remote --tags origin "refs/tags/v$base")" ]; then
            # main 에 올라온 VERSION 이 아직 릴리스되지 않았으면 자동으로 릴리스한다.
            name="$base"; release=true
          else
            name="$base-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=Asia/Seoul date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          dotnet publish src/EveryVideo/EveryVideo.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true \
            -p:Version="${{ steps.ver.outputs.name }}" -p:BuildDate="${{ steps.ver.outputs.date }}" \
            -o dist/EveryVideo
          rm -f dist/EveryVideo/*.pdb

      - name: Bundle FFmpeg
        run: |
          curl -fsSL --retry 3 -o ffmpeg.zip \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          7z x -y -offmpeg ffmpeg.zip > /dev/null
          mkdir -p dist/EveryVideo/ffmpeg
          cp ffmpeg/*/bin/ffmpeg.exe dist/EveryVideo/ffmpeg/
          cp ffmpeg/*/LICENSE.txt dist/EveryVideo/ffmpeg/LICENSE.txt
          ./dist/EveryVideo/ffmpeg/ffmpeg.exe -hide_banner -version | head -1
          cp README.md RELEASE_NOTES.md THIRD_PARTY.md dist/EveryVideo/

      - name: Self test (all windows load, engine starts, ffmpeg found)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\EveryVideo\EveryVideo.exe" -ArgumentList "--selftest" -PassThru -Wait
          $log = Join-Path $env:APPDATA "EveryVideo\log.txt"
          if (Test-Path $log) { Get-Content $log; Remove-Item $log }
          if ($p.ExitCode -ne 0) { Write-Error "self test failed (code $($p.ExitCode))"; exit 1 }

      - name: Smoke test (plays, starts fast the second time, closes quickly)
        shell: pwsh
        run: |
          # 시험용 동영상을 만들어 실제로 재생해 본다.
          & "dist\EveryVideo\ffmpeg\ffmpeg.exe" -hide_banner -loglevel error -y -f lavfi -i testsrc=d=20:s=1280x720:r=30 -f lavfi -i sine=d=20 -c:v libx264 -c:a aac -shortest "$env:RUNNER_TEMP\test.mp4"
          $log = Join-Path $env:APPDATA "EveryVideo\log.txt"
          $plugins = "dist\EveryVideo\libvlc\win-x64\plugins"
          foreach ($run in 1, 2) {
            $p = Start-Process -FilePath "dist\EveryVideo\EveryVideo.exe" -ArgumentList "`"$env:RUNNER_TEMP\test.mp4`"" -PassThru
            Start-Sleep -Seconds 12
            if ($p.HasExited) { if (Test-Path $log) { Get-Content $log }; Write-Error "EveryVideo exited early (code $($p.ExitCode))"; exit 1 }
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $null = $p.CloseMainWindow()
            if (-not $p.WaitForExit(4000)) { Stop-Process -Id $p.Id -Force; Write-Error "EveryVideo did not close within 4 s"; exit 1 }
            Write-Host "run $run closed in $($sw.ElapsedMilliseconds) ms"
            if ($run -eq 1 -and -not (Test-Path "$plugins\plugins.dat")) { Write-Error "plugins cache was not created"; exit 1 }
          }
          if (Test-Path $log) { Get-Content $log }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern "unhandled|libvlc init|video host|play error" -Quiet)) {
            Write-Error "EveryVideo logged a startup error"; exit 1
          }
          if (-not (Select-String -Path $log -Pattern "playing test.mp4" -Quiet)) { Write-Error "test.mp4 did not play"; exit 1 }
          # 캐시는 받는 PC 에서 처음 실행할 때 만든다(파일 시각이 PC 마다 달라서).
          Remove-Item "$plugins\plugins.dat", "$plugins\plugins.ver" -ErrorAction SilentlyContinue

      - name: Portable zip
        run: |
          cd dist
          7z a -tzip -mx=7 "EveryVideo-${{ steps.ver.outputs.name }}-win-x64-portable.zip" EveryVideo > /dev/null
          ls -la

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          $dist = Join-Path $PWD "dist"
          & $iscc /Q "/DAppVersion=${{ steps.ver.outputs.name }}" "/DSourceDir=$dist\EveryVideo" "/O$dist" installer\EveryVideo.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist
          if (-not (Get-ChildItem "$dist\*-setup.exe")) { Write-Error "setup.exe was not created"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: EveryVideo-${{ steps.ver.outputs.name }}-windows
          path: |
            dist/*.zip
            dist/*-setup.exe

      - name: Publish GitHub Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: EveryVideo for Windows v${{ steps.ver.outputs.name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.zip
            dist/*-setup.exe
